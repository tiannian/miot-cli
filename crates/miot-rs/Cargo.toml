[package]
name = "miot-rs"
version = "0.1.0"
description = "Asynchronous Rust SDK for MIoT devices"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
getrandom = "0.3"
hex = "0.4"
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tracing = "0.1"
thiserror = "2"
tokio = { version = "1", features = ["net", "time"] }
url = "2"
